name: productive_muslim
description: "The Productive Muslim app — a coach-like guided experience combining Islamic intention-setting with modern productivity science."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.0.0
  freezed: ^2.5.0
  freezed_annotation: ^2.4.0

  # Routing
  go_router: ^14.0.0

  # DI
  get_it: ^7.6.0

  # Local storage
  drift: ^2.34.0
  drift_flutter: ^2.34.0

  # Serialization
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Notifications
  flutter_local_notifications: ^18.0.0

  # Prayer times
  adhan_dart: ^2.0.0
  timezone: ^0.11.0

  # Location
  geolocator: ^11.0.0
  permission_handler: ^12.0.0

  # Development device preview
  device_preview: ^3.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.0
  drift_dev: ^2.34.0
  json_serializable: ^6.8.0
  freezed: ^2.5.0
  bloc_test: ^9.1.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/audio/
    - assets/json/
    - assets/fonts/

  fonts:
    - family: SFProDisplay
      fonts:
        - asset: fonts/SFProDisplay-Regular.ttf
        - asset: fonts/SFProDisplay-Medium.ttf
          weight: 500
        - asset: fonts/SFProDisplay-Semibold.ttf
          weight: 600
        - asset: fonts/SFProDisplay-Bold.ttf
          weight: 700