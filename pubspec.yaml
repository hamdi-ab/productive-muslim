name: productive_muslim
description: "The Productive Muslim app — a coach-like guided experience combining Islamic intention-setting with modern productivity science."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  freezed: ^4.0.1
  freezed_annotation: ^3.1.0

  # Routing
  go_router: ^18.0.1

  # DI
  get_it: ^9.2.1

  # Local storage
  drift: ^2.34.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # Serialization
  json_annotation: ^4.12.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Notifications
  flutter_local_notifications: ^22.3.0

  # Prayer times
  adhan_dart: ^2.0.1
  timezone: ^0.11.1

  # Location
  geolocator: ^14.0.3
  permission_handler: ^13.0.2

  # Development device preview
  device_preview: ^3.0.0

  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  json_serializable: ^6.14.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/audio/
    - assets/json/